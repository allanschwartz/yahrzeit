# -----------------------------------------------------------------------------
# @file        CBL-02-molex-p-to-jst-vh-50mm.yml
#
# @brief       Legacy YYZ-PIXEL to YYZ Pixel V2 power adapter cable.
#
#              Adapts the JST VH 2-position power connector used on
#              YYZ_PIXEL_V2 to a legacy YYZ-PIXEL POWER-IN connector.
#
#              The legacy connector uses only circuits 1 and 3.
#              Circuit 2 is intentionally unused.
#
# @history     version 1.0 created August 2026
#              version 1.1 corrected legacy connector identification
#              to Molex Mini-Fit Jr., August 2026
#
# @author      Allan M. Schwartz
#
# @copyright   copyright (c) 2026, by Allan M. Schwartz
#              All rights reserved.
#
# @notes       WireViz source file.
#
#              Legacy YYZ-PIXEL wiring:
#                Molex circuit 1 = +5V, red
#                Molex circuit 2 = not connected
#                Molex circuit 3 = GND, black
#
#              JST VH wiring:
#                pin 1 = +5V
#                pin 2 = GND
#
#              The Molex plug on this adapter mates with the
#              legacy 5557-series receptacle used for YYZ-PIXEL POWER-IN.
#
#              Finished cable assembly is intended for manufacture by
#              PCBWay or equivalent cable-assembly vendor.
# -----------------------------------------------------------------------------


metadata:
  title: YYZ Pixel V2 Legacy Power Adapter 02
  revision: A
  description: >
    50 mm adapter cable from JST VH to legacy YYZ-PIXEL POWER-IN.
    Molex Mini-Fit Jr. 3-circuit plug to JST VH 2-position receptacle.
    Connects +5V and GND only.


connectors:

  # Adapter connector which mates with the legacy YYZ-PIXEL POWER-IN receptacle.
  #
  # Molex Mini-Fit Jr., 4.20 mm pitch, 3 circuits, single row.
  #
  # Only circuits 1 and 3 are populated.
  # Circuit 2 is intentionally unused.
  #
  # Housing:
  #   Molex 39-01-4032
  #   Engineering number 5559-03P2
  #
  # Contact:
  #   Molex 39-00-0041
  #   Mini-Fit male crimp terminal, 24-18 AWG, bag.

  J1:
    image:
        src: molex_5559-03P.JPG
        width: 200
        caption: Molex Mini-Fit Jr. 03P
    type: Molex Mini-Fit Jr.
    subtype: plug
    pincount: 3
    pinlabels: [+5V, NC, GND]
    manufacturer: Molex
    mpn: 39-01-4032
    notes: |
      for: <i>legacy <b>YYZ-PIXEL POWER-IN</b></i>

    additional_components:
      - type: Male crimp contact
        qty: 2
        manufacturer: Molex
        mpn: 39-00-0041


  # New YYZ_PIXEL_V2 power connector.
  #
  # VHR-2N is the JST VH 2-position cable receptacle housing.
  # SVH-21T-P1.1 is the female crimp contact selected for 18 AWG wire.

  J2:
    image:
        src: JST_VHR-2N.png
        caption: JST VHR-2N
        width: 200
    type: JST VH
    subtype: F cable receptacle
    pincount: 2
    pinlabels: [+5V, GND]
    manufacturer: JST
    mpn: VHR-2N
    notes: |
      for: <i><b>YYZ-PIXEL_V2 </b> end</i>

    additional_components:
      - type: Crimp contact
        qty_multiplier: populated
        manufacturer: JST
        mpn: SVH-21T-P1.1


cables:

  W1:
    category: bundle
    wirecount: 2
    gauge: 18 AWG
    length: 50 mm
    colors: [RD, BK]
    wirelabels: [+5V, GND]
    notes: |
      Finished Cable Length: 50 mm +/- 5 mm.

      • Measure length between the rear wire-exit
        faces of the two connector housings.

      • Use manufacturer-approved crimp tooling,
        or equivalent production crimp tooling.

      • Test assembly for continuity and polarity.


connections:

  # Legacy circuit 2 is intentionally unpopulated.
  #
  # J1 circuit 1 -> red wire   -> J2 pin 1
  # J1 circuit 3 -> black wire -> J2 pin 2

  -
    - J1: [1, 3]
    - W1: [1, 2]
    - J2: [1, 2]
